<form method="get" class="filter-form" aria-label="Filter records">{% if filter.errors %}<div class="notice error" role="alert">{{ filter.non_field_errors }}{% for field in filter %}{{ field.errors }}{% endfor %}</div>{% endif %}{% for field in filter %}{% if field.name != 'page' %}<div class="form-field">{{ field.as_field_group }}</div>{% endif %}{% endfor %}<input type="hidden" name="page" value="1"><button class="button secondary" type="submit">Apply filters</button></form>
