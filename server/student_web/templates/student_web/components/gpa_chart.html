{% load l10n %}{% if chart %}<figure class="standing-chart"><figcaption class="muted">Bars in the order of your Semesters page · {{ scale.name|default:'5-point' }} scale</figcaption><ul class="standing-legend" aria-hidden="true"><li><span class="standing-swatch bar"></span>Semester GPA</li>{% if chart.cgpa %}<li><span class="standing-swatch line"></span>Overall CGPA</li>{% endif %}</ul><svg viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="Bar chart of GPA for each semester{% if chart.cgpa %}, with overall CGPA {{ chart.cgpa.value|floatformat:2 }}{% endif %}. The same values are in the table below.">{% localize off %}{% for tick in chart.ticks %}<line class="standing-grid" x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ tick.y }}" y2="{{ tick.y }}"/><text class="standing-axis" x="{{ chart.left|add:'-8' }}" y="{{ tick.y }}" dy="4" text-anchor="end">{{ tick.value }}</text>{% endfor %}{% for bar in chart.bars %}<g class="standing-bar">{% if bar.path %}<rect class="standing-hit" x="{{ bar.hit.x }}" y="{{ chart.top }}" width="{{ bar.hit.width }}" height="{{ chart.plot_height }}"/><path d="{{ bar.path }}"/><title>{{ bar.full_label }}: GPA {{ bar.gpa|floatformat:2 }}</title>{% else %}<text class="standing-axis" x="{{ bar.centre }}" y="{{ chart.base|add:'-6' }}" text-anchor="middle">no grades</text><title>{{ bar.full_label }}: not graded yet</title>{% endif %}{% if chart.show_labels %}<text class="standing-axis" x="{{ bar.centre }}" y="{{ chart.label_y }}" text-anchor="middle">{{ bar.label }}</text>{% endif %}</g>{% endfor %}{% if chart.cgpa %}<line class="standing-cgpa" x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ chart.cgpa.y }}" y2="{{ chart.cgpa.y }}"/><text class="standing-cgpa-label" x="{{ chart.right|add:'6' }}" y="{{ chart.cgpa.y }}" dy="4">CGPA {{ chart.cgpa.value|floatformat:2 }}</text>{% endif %}{% endlocalize %}</svg></figure>{% endif %}
