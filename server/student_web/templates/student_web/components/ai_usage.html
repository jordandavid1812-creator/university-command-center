<section class="ai-usage" aria-label="Today's AI usage"><p><strong>{{ usage.used_today }} of {{ usage.daily_limit }}</strong> AI requests used today <span class="muted">· resets at midnight (Lagos time) · {{ usage.results }} of {{ usage.max_results }} results saved</span></p><meter class="ai-meter" min="0" max="{{ usage.daily_limit }}" value="{{ usage.used_today }}" low="{{ usage.daily_limit|add:'-15' }}" high="{{ usage.daily_limit|add:'-5' }}" optimum="0" aria-label="AI requests used today">{{ usage.used_today }} of {{ usage.daily_limit }}</meter></section>
