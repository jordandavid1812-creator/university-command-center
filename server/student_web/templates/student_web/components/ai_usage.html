<section class="panel ai-usage" aria-labelledby="usage-heading"><h2 id="usage-heading" class="sr-only">Today's AI usage</h2><p><strong>{{ usage.used_today }} of {{ usage.daily_limit }}</strong> AI requests used today<span class="muted"> · resets at midnight (Lagos time)</span></p><meter class="ai-meter" min="0" max="{{ usage.daily_limit }}" value="{{ usage.used_today }}" low="{{ usage.daily_limit|add:'-15' }}" high="{{ usage.daily_limit|add:'-5' }}" optimum="0" aria-label="AI requests used today">{{ usage.used_today }} of {{ usage.daily_limit }}</meter><p class="muted">Saved results: {{ usage.results }} of {{ usage.max_results }}.</p></section>
