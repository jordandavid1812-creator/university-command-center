# The whole website on one server: the database, the website and Caddy (HTTPS).
# Run from the repository folder:  docker compose -f deploy/compose.yml ...
# Private settings live in deploy/secrets/ (made by deploy/make_secrets.py, never committed).
name: ucc

services:
  db:
    image: postgres:17.12
    restart: unless-stopped
    env_file: ${UCC_SECRETS:-./secrets}/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-ucc-roles.sh:ro
    networks: [backend]
    shm_size: 128mb
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off database updates with the migrator login:  docker compose run --rm migrate
  migrate:
    image: ucc-web:local
    profiles: [tools]
    env_file: ${UCC_SECRETS:-./secrets}/migrator.env
    command: ["/app/deploy/provision.sh"]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: {condition: service_healthy}

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ucc-web:local
    restart: unless-stopped
    env_file: ${UCC_SECRETS:-./secrets}/web.env
    # No published ports: only Caddy can reach the website, inside the server.
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db: {condition: service_healthy}

  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    env_file: ${UCC_SECRETS:-./secrets}/caddy.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend:
        # Fixed address: the website trusts forwarded headers from this address only.
        ipv4_address: 172.30.0.10
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on: [web]

networks:
  # The database network has no internet and no way in from outside.
  backend:
    internal: true
  # Caddy and the website (with internet for AI and email). Caddy's fixed address must match
  # UCC_TRUSTED_PROXY in secrets/web.env.
  frontend:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
