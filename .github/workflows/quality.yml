name: Foundation quality

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip check
      - run: python -c "from streamlit.testing.v1 import AppTest"
      - run: python tools/check_repository_safety.py
      - run: python -m unittest discover -v

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --strict --require-hashes --disable-pip --progress-spinner off -r requirements-lock.txt
