name: Foundation quality

on:
  pull_request:
  push:
    branches: [master, feature/database-foundation]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python -m pip check
      - run: python -c "from streamlit.testing.v1 import AppTest"
      - run: python tools/check_repository_safety.py
      - run: python -m unittest discover -v

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --strict --require-hashes --disable-pip --progress-spinner off -r requirements-lock.txt -r requirements-django-lock.txt

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable runner-local service, no committed password or reusable secret.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ucc_ci
          POSTGRES_DB: ucc_ci_scratch
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U ucc_ci -d ucc_ci_scratch"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: ucc_ci
      PGDATABASE: ucc_ci_scratch
      PGTESTDATABASE: test_ucc_ci
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Generate ephemeral Django key
        run: python -c "import os, secrets; open(os.environ['GITHUB_ENV'], 'a').write('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(64) + '\n')"
      - run: python -m pip install --upgrade pip==26.3
      - run: python -m pip install --require-hashes -r requirements-django-lock.txt
      - run: python -m pip check
      - run: python server/manage.py check
      - run: python server/manage.py makemigrations --check --dry-run
      - run: python server/manage.py migrate --noinput
      - run: python server/manage.py test accounts academics --settings=config.settings.test -v 2
